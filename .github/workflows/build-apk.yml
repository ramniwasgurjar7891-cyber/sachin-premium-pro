
name: Build SACHIN PREMIUM PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SachinPremiumProAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          
      - name: Extract Android project
        run: |
          unzip -q SachinPremiumProAndroid_Project.zip
          ls -la SachinPremiumProAndroid

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd SachinPremiumProAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SACHIN-PREMIUM-PRO-APK
          path: SachinPremiumProAndroid/app/build/outputs/apk/debug/app-debug.apk
          
